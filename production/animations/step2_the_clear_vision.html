<!doctype html>
<html><head><meta charset="utf-8"><title>Masterclass Manual</title>
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style></head>
<body><canvas id="c" width="1280" height="720"></canvas>
<script>
const W=1280,H=720,TAU=Math.PI*2;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const eo=x=>1-Math.pow(1-clamp(x),3);
const eio=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const lerp=(a,b,t)=>a+(b-a)*t;
function mul(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const hex=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
const mix=(a,b,t)=>a.map((v,i)=>v+(b[i]-v)*t);
const rgba=(c,a)=>`rgba(${c[0]|0},${c[1]|0},${c[2]|0},${Math.max(0,a)})`;
const GOLD=[242,196,109],BLUE=[143,180,255],TEAL=[111,211,200],VIOLET=[183,156,255],GREEN=[143,214,148],WHITE=[232,238,255],GRAY=[128,138,165],ROSE=[232,120,130];

function orb(x,y,r,c,a){if(r<=0||a<=0)return;const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,rgba(c,a));g.addColorStop(.4,rgba(c,a*.33));g.addColorStop(1,rgba(c,0));ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fill()}
function ring(x,y,r,c,a,lw=1.5){if(r<=0||a<=0)return;ctx.strokeStyle=rgba(c,a);ctx.lineWidth=lw;ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.stroke()}
function dot(x,y,r,c,a){if(r<=0||a<=0)return;ctx.fillStyle=rgba(c,a);ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fill()}
function star4(x,y,r,c,a,rot=0){ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.fillStyle=rgba(c,a);ctx.beginPath();const k=r*.07;ctx.moveTo(0,-r);ctx.quadraticCurveTo(k,-k,r,0);ctx.quadraticCurveTo(k,k,0,r);ctx.quadraticCurveTo(-k,k,-r,0);ctx.quadraticCurveTo(-k,-k,0,-r);ctx.fill();ctx.restore()}
function rrect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function txtS(s,x,y,size,c,a,sp=3,al='center'){ctx.save();ctx.font=`500 ${size}px Inter`;ctx.letterSpacing=sp+'px';ctx.textAlign=al;ctx.fillStyle=rgba(c,a);ctx.fillText(s,x,y);ctx.restore()}

/* ---------- background ---------- */
const BGK=[[0,'#0a0f24','#131c40'],[20,'#0a0f24','#131c40'],[28,'#071a1f','#0e3340'],[126,'#071a1f','#0e3340'],[136,'#0a1520','#1a2f4a'],[200,'#0a1520','#1a2f4a'],[210,'#1a1810','#3a3420'],[240,'#1a1810','#3a3420'],[256,'#0a0f24','#2a1f3d'],[300,'#0a0f24','#2a1f3d']].map(k=>[k[0],hex(k[1]),hex(k[2])]);
function bgAt(t){for(let i=0;i<BGK.length-1;i++){const a=BGK[i],b=BGK[i+1];if(t<=b[0]){const u=eio((t-a[0])/(b[0]-a[0]||1));return[mix(a[1],b[1],u),mix(a[2],b[2],u)]}}return[BGK[BGK.length-1][1],BGK[BGK.length-1][2]]}
const dr=mul(11),DUST=Array.from({length:80},()=>({x:dr()*W,y:dr()*H,r:.6+dr()*1.8,s:3+dr()*9,ph:dr()*TAU,a:.15+dr()*.45,dx:(dr()-.5)*6}));
function drawBG(gt){
  const[top,bot]=bgAt(gt);const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,rgba(top,1));g.addColorStop(1,rgba(bot,1));ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  const ox=640+Math.sin(gt*.05)*260,oy=300+Math.cos(gt*.04)*80;orb(ox,oy,520,mix(bot,[255,255,255],.18),.35);
  for(const d of DUST){const x=((d.x+gt*d.dx)%W+W)%W,y=((d.y-gt*d.s)%H+H)%H;dot(x,y,d.r,WHITE,d.a*(.5+.5*Math.sin(gt*.6+d.ph)))}
}

/* ---------- text ---------- */
let LT=0,A=1,ACC=GOLD;
const KCOL={h:[246,242,232],s:[197,205,230],a:[246,242,232]};
function T(str,y,size,t0,t1,kind='h'){
  const p=eo((LT-t0)/1.8);let a=p*(t1?1-eo((LT-(t1-1.5))/1.5):1)*A;if(a<=.003)return;
  const dy=(1-p)*16;const lines=str.split('\n');
  const fam=kind==='s'?'Inter':kind==='e'?'Inter':'"Bitstream Charter"';
  const wt=kind==='s'?300:kind==='e'?500:400;
  const sp=kind==='s'?.4:kind==='e'?(size>30?0:10):0;
  lines.forEach((ln,li)=>{
    const segs=ln.split('*');ctx.save();ctx.font=`${wt} ${size}px ${fam}`;ctx.letterSpacing=sp+'px';ctx.textAlign='left';
    const ws=segs.map((s,i)=>{ctx.font=`${i%2?(kind==='s'?400:700):wt} ${size}px ${fam}`;return ctx.measureText(s).width});
    const tot=ws.reduce((a,b)=>a+b,0);let x=W/2-tot/2;const yy=y+dy+li*(size*(kind==='s'?1.55:1.25));
    segs.forEach((s,i)=>{
      ctx.font=`${i%2?(kind==='s'?400:700):wt} ${size}px ${fam}`;
      if(i%2){
        const pulse=.5+.5*Math.sin(LT*1.6+i);
        ctx.shadowColor=rgba(GOLD,.85*a);ctx.shadowBlur=10+12*pulse*eo((LT-t0-.6)/1.2);
        ctx.fillStyle=rgba(GOLD,a);ctx.fillText(s,x,yy);ctx.shadowBlur=0;
        const u=eo((LT-t0-1.1)/1.6);if(u>0){ctx.strokeStyle=rgba(GOLD,.65*a);ctx.lineWidth=1.6;ctx.beginPath();ctx.moveTo(x,yy+size*.16);ctx.lineTo(x+ws[i]*u,yy+size*.16);ctx.stroke()}
      }else{ctx.fillStyle=kind==='e'?rgba(ACC,a):rgba(KCOL[kind]||KCOL.h,a);ctx.fillText(s,x,yy)}
      x+=ws[i];
    });ctx.restore();
  });
}

function vBreath(t){
  const cyc=(t%8)/8;const br=.5-.5*Math.cos(cyc*TAU);const r=62+38*br;
  const e=eo(t/3);ctx.translate(0,-10);
  orb(0,0,r*3.4,VIOLET,.28*e);orb(0,0,r*1.7,GOLD,.45*e);ring(0,0,r,GOLD,.55*e,1.6);ring(0,0,r*1.45,VIOLET,.25*e,1);dot(0,0,r*.5,[255,238,200],.8*e);
  txtS(cyc<.5?'BREATHE IN':'BREATHE OUT',0,-(r*1.45+16),12,WHITE,.4*e,6);
}
/* ---------- VIDEO 2 visuals ---------- */
const AMBER=[255,176,96];
function vOpen(t){
  ctx.translate(0,-20);const e=eo(t/3);
  for(let k=0;k<6;k++){const r=((t*30+k*58)%350);ring(0,0,r,GOLD,(1-r/350)*.5*e,1.4)}
  orb(0,0,150,GOLD,.45*e);dot(0,0,10+2*Math.sin(t*.8),[255,240,200],.95*e);star4(0,0,50*e,GOLD,.5*e,t*.1);
  for(let i=0;i<24;i++){const k=((t*.07+i*.0417)%1),a=i*2.4;dot(Math.cos(a)*(60+k*60)*(1+i%3*.5),-k*230+40,1.6+1.4*(i%3),GOLD,Math.sin(k*Math.PI)*.8*e)}
}
function wedge(cx,cy,r,a0,a1,c,al){ctx.fillStyle=rgba(c,al);ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,r,a0,a1);ctx.closePath();ctx.fill()}
function vLenses(t){
  const e=eo(t/3),dimL=1-.6*eo((t-25)/4),brR=.75+.25*eo((t-25)/4);
  // scarcity pie
  const px=-190,rem=lerp(TAU,TAU*.28,eio((t-4)/18));
  ctx.save();ctx.globalAlpha=A*e*dimL;
  wedge(px,0,86,-Math.PI/2,-Math.PI/2+rem,GRAY,.7);ring(px,0,86,GRAY,.9,1.6);
  for(let k=0;k<4;k++){const th=-Math.PI/2+rem+k*.08,f=eo((t-4-k*3)/6);if(rem<TAU*.97)wedge(px+Math.cos(th)*f*100,Math.sin(th)*f*100,86,th,th+.9,GRAY,.25*(1-f))}
  ctx.restore();txtS('SCARCITY',px,128,13,GRAY,.8*e*dimL,5);
  // abundance spring
  const sx=190;ctx.save();ctx.globalAlpha=A*e*brR;
  for(let k=0;k<5;k++){const r=((t*26+k*34)%170);ring(sx,40,r,GOLD,(1-r/170)*.55,1.4)}
  orb(sx,40,110,GOLD,.45);dot(sx,40,12,[255,240,200],.95);
  for(let i=0;i<22;i++){const k=((t*.25+i*.0455)%1),a=-Math.PI/2+(i%2?1:-1)*(.25+.55*((i*7)%10)/10),v=130;const x=sx+Math.cos(a)*v*k*1.1,y=40+Math.sin(a)*v*k+170*k*k;dot(x,y,2.2,GOLD,(1-k)*.9)}
  ctx.restore();txtS('ABUNDANCE',sx,128,13,GOLD,.9*e*brR,5);
}
function vFocus(t){
  const c=eo((t-8)/5),e=eo(t/2);
  ctx.strokeStyle=rgba(GOLD,.5*e);ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(-60,0,16,110,0,0,TAU);ctx.stroke();orb(-60,0,60,GOLD,.15*e*c);
  for(let i=-8;i<=8;i++){const y0=i*13,yE=lerp(y0*1.9,0,c);
    ctx.strokeStyle=rgba(GOLD,.4*e);ctx.lineWidth=1.4;ctx.beginPath();ctx.moveTo(-370,y0);ctx.lineTo(-60,y0);ctx.stroke();
    ctx.strokeStyle=rgba(GOLD,lerp(.16,.6,c)*e);ctx.beginPath();ctx.moveTo(-60,y0);ctx.lineTo(240,yE);ctx.stroke()}
  const fl=.5+.5*Math.sin(t*5);orb(240,0,20+110*c,[255,200,110],.15+.7*c);dot(240,0,3+9*c,[255,248,225],.4+.6*c);
  if(c>.2){ctx.save();ctx.translate(240,0);star4(0,0,(40+8*fl)*c,[255,235,180],.8*c,0);ctx.restore();
    for(let i=0;i<14;i++){const k=((t*.3+i*.0714)%1);dot(240+Math.sin(i*3)*18*k,-k*120*c,2*(1-k),[255,220,150],(1-k)*.8*c)}}
}
function vFrame(t){
  const e=eo(t/2),n=5,w=110,g=28,x0=-(n*w+(n-1)*g)/2;
  for(let i=0;i<n;i++){const x=x0+i*(w+g),k=i==0?0:eo((t-6-(i-1)*3.6)/3);const col=mix(GRAY,GOLD,k);
    ctx.strokeStyle=rgba(mix(GRAY,WHITE,k),.5+.3*k);ctx.lineWidth=2;rrect(x,-62,w,110,10);ctx.stroke();ctx.fillStyle=rgba(col,.06+.16*k);ctx.fill();
    ctx.strokeStyle=rgba(col,.35);ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(x+8,22);ctx.lineTo(x+w-8,22);ctx.stroke();
    const cx=x+w/2,cy=-8,r=7+i*5.5;orb(cx,cy,r*3.2*(.4+.6*k),col,.55*k+.15);dot(cx,cy,r*(.6+.4*k),col,.35+.6*k);
    for(let s=0;s<i*3*k;s++){const a=s*2.4+t*.1;dot(cx+Math.cos(a)*(r+6+s*1.4),cy+Math.sin(a)*(r+6+s*1.4),1.4,GOLD,.7*k)}
    if(i<n-1){ctx.strokeStyle=rgba(WHITE,.2*e);ctx.beginPath();ctx.moveTo(x+w+6,-8);ctx.lineTo(x+w+g-6,-8);ctx.stroke()}}
  txtS('NOW',x0+w/2,80,13,GRAY,.9*e,5);txtS('NEXT',x0+4*(w+g)+w/2,80,13,GOLD,.9*eo((t-14)/3),5);
  const fx=x0+w/2+eio((t-4)/16)*(4*(w+g));const fa=eo((t-4)/2)*(1-eo((t-21)/3));
  ctx.fillStyle=rgba(GOLD,.9*fa);ctx.beginPath();ctx.moveTo(fx,-84);ctx.lineTo(fx-7,-96);ctx.lineTo(fx+7,-96);ctx.fill();
}
function vWindow(t){
  const lg=eo((t-6)/24),e=eo(t/3),wx=0,wy=-70,ww=150,wh=190;
  // beam
  const g=ctx.createLinearGradient(0,wy+wh,0,130);g.addColorStop(0,rgba(GOLD,.5*lg));g.addColorStop(1,rgba(GOLD,0));ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(-ww/2+10,wy+wh-6);ctx.lineTo(ww/2-10,wy+wh-6);ctx.lineTo(ww/2+90*lg,128);ctx.lineTo(-ww/2-90*lg,128);ctx.fill();
  // window
  ctx.fillStyle=rgba(mix([20,22,40],[255,214,140],lg),.9*e);rrect(wx-ww/2,wy,ww,wh,6);ctx.fill();orb(0,wy+wh*.45,50+170*lg,GOLD,.5*lg);
  ctx.strokeStyle=rgba(WHITE,.55*e);ctx.lineWidth=3;rrect(wx-ww/2,wy,ww,wh,6);ctx.stroke();ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,wy);ctx.lineTo(0,wy+wh);ctx.moveTo(wx-ww/2,wy+wh*.5);ctx.lineTo(wx+ww/2,wy+wh*.5);ctx.stroke();

  for(let i=0;i<20;i++){const k=((t*.06+i*.05)%1);dot(Math.sin(i*5.3)*(30+120*lg)*(.4+k),wy+wh*.5+k*170,1.6,GOLD,Math.sin(k*Math.PI)*.7*lg)}
}
function vScore(t){
  const e=eo(t/2.5),fade=1-eo((t-14)/6);
  const nL=Math.min(14,Math.floor(Math.max(0,t-2)/.85)+(t>2&&0)),nR=Math.min(14,Math.floor(Math.max(0,t-2.4)/.85));
  [[-170,BLUE,nL],[170,ROSE,nR]].forEach(([x,c,n],si)=>{
    const col=mix(c,GOLD,eo((t-15)/6));ring(x,-20,52,col,.9*e,2);orb(x,-20,90,col,.25*e);
    for(let i=0;i<n;i++){const row=Math.floor(i/5),ci=i%5,tx=x-34+ci*17,ty=62+row*26;ctx.strokeStyle=rgba(col,.9*fade*e);ctx.lineWidth=2;ctx.beginPath();if(ci<4){ctx.moveTo(tx,ty);ctx.lineTo(tx,ty+18)}else{ctx.moveTo(tx-68,ty+16);ctx.lineTo(tx-4,ty+2)}ctx.stroke()}
    if(t>14)for(let i=0;i<n;i++){const k=eo((t-14-i*.15)/5);dot(x-30+(i%5)*15+Math.sin(i)*10,70+Math.floor(i/5)*26-k*150,2,col,(1-k)*.7)}
  });
  const tn=ctx.createLinearGradient(-110,0,110,0);ctx.strokeStyle=rgba(ROSE,.55*fade*e);ctx.lineWidth=2;ctx.setLineDash([7,8]);ctx.lineDashOffset=-t*14;ctx.beginPath();ctx.moveTo(-116,-20);ctx.lineTo(116,-20);ctx.stroke();ctx.setLineDash([]);
  txtS('VS',0,-14,18,WHITE,.55*fade*e,6);
  if(t>16){const r=eo((t-16)/6);orb(0,-20,120*r,GOLD,.3*r)}
}
function candle(x,y,h,lit,t,ph){
  ctx.fillStyle=rgba([235,228,210],.9);rrect(x-13,y-h,26,h,4);ctx.fill();ctx.fillStyle=rgba([30,30,40],.7);ctx.fillRect(x-13,y-h,26,6);
  ctx.strokeStyle=rgba([60,50,40],.9);ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x,y-h);ctx.lineTo(x,y-h-10);ctx.stroke();
  if(lit>0){const fl=1+.08*Math.sin(t*9+ph)+.05*Math.sin(t*13+ph*2);orb(x,y-h-22,70*lit*fl,AMBER,.5*lit);
    ctx.fillStyle=rgba([255,200,110],.95*lit);ctx.beginPath();ctx.ellipse(x,y-h-22,7*lit*fl,17*lit*fl,0,0,TAU);ctx.fill();ctx.fillStyle=rgba([255,248,225],.95*lit);ctx.beginPath();ctx.ellipse(x,y-h-18,3.4*lit,8*lit,0,0,TAU);ctx.fill()}
}
function vCandle(t){
  const e=eo(t/2.5),base=100;
  const spark=eio((t-7)/3);const L=-110,Rr=110,h=90;
  ctx.globalAlpha=A*e;
  const extra=[[-230,70],[-330,56],[230,70],[330,56],[-290,62],[290,62]];
  extra.forEach(([x,hh],i)=>{const lit=eo((t-14-i*1.2)/2.5);candle(x,base,hh,lit,t,i)});
  candle(L,base,h,1,t,0);candle(Rr,base,h,eo((t-9.8)/1.5),t,2);
  if(spark>0&&spark<1){const x=lerp(L,Rr,spark),y=base-h-22-Math.sin(spark*Math.PI)*70;orb(x,y,28,[255,230,170],.9);dot(x,y,3.4,WHITE,1)}
  ctx.globalAlpha=A;
}
function vRelease(t){
  const e=eo(t/2.5),apart=eio((t-6)/12),x=lerp(75,225,apart);
  const slack=eio((t-4)/9),fadeRope=1-eo((t-14)/4);
  const a=[-x,0],b=[x,0];
  if(fadeRope>0){ctx.strokeStyle=rgba(ROSE,.7*fadeRope*e);ctx.lineWidth=2.4;ctx.beginPath();ctx.moveTo(a[0]+30,0);ctx.bezierCurveTo(a[0]+x*.6,slack*70,b[0]-x*.6,slack*70,b[0]-30,0);ctx.stroke();
    if(slack<.2){for(let i=-1;i<=1;i+=2){dot(i*30,0,2,ROSE,.8*fadeRope)}}}
  [[a,BLUE],[b,GOLD]].forEach(([p,c],i)=>{const o=eo((t-12)/5);orb(p[0],0,100,c,.4*e);dot(p[0],0,26,mix(c,[255,255,255],.35),.95*e);ring(p[0],0,26,c,.8*e,2);
    for(let k=1;k<=2;k++){ctx.save();ctx.translate(p[0],0);ctx.strokeStyle=rgba(c,.3*o);ctx.lineWidth=1;ctx.setLineDash([3,8]);ctx.beginPath();ctx.ellipse(0,0,44+k*28,(44+k*28)*.55,.3*(i?-1:1),0,TAU);ctx.stroke();ctx.setLineDash([]);const aa=t*.35*(i?-1:1)+k*2;dot(Math.cos(aa)*(44+k*28),Math.sin(aa)*(44+k*28)*.55,2.6,c,.9*o);ctx.restore()}});
  const bd=eo((t-20)/4);if(bd>0){const g=ctx.createLinearGradient(0,-120,0,130);g.addColorStop(0,rgba(TEAL,0));g.addColorStop(.5,rgba(TEAL,.55*bd));g.addColorStop(1,rgba(TEAL,0));ctx.fillStyle=g;ctx.fillRect(-1.5,-120,3,250);orb(0,0,40,TEAL,.2*bd)}
  for(let i=0;i<40;i++){const sx=((i*173)%700)-350,sy=((i*91)%240)-130;dot(sx,sy,1.1,WHITE,(.15+.2*Math.sin(t*.8+i))*e)}
}
function vBuild(t){
  const e=eo(t/2);orb(0,0,130,GOLD,.4*e);dot(0,0,12,[255,240,200],.95*e);
  const N=120;for(let i=1;i<N;i++){const k=eo((t-2-i*.17)/2);if(k<=0)continue;const a=i*2.39996+t*.04,r=Math.sqrt(i)*28*k,x=Math.cos(a)*r*1.15,y=Math.sin(a)*r*.55;const c=mix(GOLD,TEAL,i/N);orb(x,y,10+8*k,c,.3*k);dot(x,y,2.4+1.4*(1-i/N),mix(c,WHITE,.4),.9*k)}
  ring(0,0,40+8*Math.sin(t*.9),GOLD,.35*e,1.2);
}
function vClose(t){
  const e=eo(t/2.5);for(let k=0;k<4;k++){const r=((t*28+k*80)%320);ring(0,0,r,GOLD,(1-r/320)*.45*e,1.3)}
  orb(0,0,200,GOLD,.5*e);dot(0,0,13,[255,248,225],e);star4(0,0,80*e,GOLD,.6*e,t*.08);
}
const rg=mul(33),GRP=Array.from({length:54},(_,i)=>({a:rg()*TAU,sp:.06+rg()*.06,off:rg(),r:1+rg()*2.2}));
function vGrat(t){
  const e=eo(t/3),br=.5+.5*Math.sin(t*.9);
  orb(0,0,230+30*br,[255,170,90],.35*e);orb(0,0,130,GOLD,.55*e);
  for(let i=0;i<18;i++){const a=i/18*TAU+t*.06,len=70+55*(.5+.5*Math.sin(t*.7+i*1.3));ctx.strokeStyle=rgba(GOLD,.28*e);ctx.lineWidth=1.4;ctx.beginPath();ctx.moveTo(Math.cos(a)*78,Math.sin(a)*78);ctx.lineTo(Math.cos(a)*(78+len),Math.sin(a)*(78+len));ctx.stroke()}
  for(const p of GRP){const k=((t*p.sp+p.off)%1),r=330*(1-k)+36;const a=Math.sin(k*Math.PI)*.8*e;dot(Math.cos(p.a+t*.03)*r,Math.sin(p.a+t*.03)*r*.62,p.r,[255,225,160],a)}
  dot(0,0,34+4*br,[255,236,190],.95*e);ring(0,0,46+4*br,[255,220,150],.5*e,1.5);

  if(k===0){const ap=lerp(6,26,eo(t/6));ring(0,cy,44,WHITE,.6*e,2);for(let i=0;i<8;i++){const a=i/8*TAU+t*.05;ctx.strokeStyle=rgba(GOLD,.55*e);ctx.lineWidth=1.6;ctx.beginPath();ctx.moveTo(Math.cos(a)*ap,cy+Math.sin(a)*ap);ctx.lineTo(Math.cos(a+.7)*44,cy+Math.sin(a+.7)*44);ctx.stroke()}orb(0,cy,ap*3,GOLD,.6*e);dot(0,cy,ap*.6,[255,244,210],e)}
  if(k===1){ctx.strokeStyle=rgba(WHITE,.6*e);ctx.lineWidth=2;ctx.strokeRect(-56,cy-38,112,76);const g=eo(t/6);orb(0,cy,70*g,GOLD,.55*e);star4(0,cy,30*g,[255,240,200],.95*e,t*.05)}
  if(k===2){for(let i=0;i<18;i++){const a=i/18*TAU+t*.1,L=22+16*(.5+.5*Math.sin(t*.8+i*1.3));ctx.strokeStyle=rgba(GOLD,.4*e);ctx.lineWidth=1.4;ctx.beginPath();ctx.moveTo(Math.cos(a)*30,cy+Math.sin(a)*30);ctx.lineTo(Math.cos(a)*(30+L),cy+Math.sin(a)*(30+L));ctx.stroke()}orb(0,cy,70,GOLD,.55*e);dot(0,cy,18,[255,240,200],e)}
  if(k===3){const g=eo(t/5);[-30,30].forEach((x,i)=>{orb(x,cy,50,i?TEAL:GOLD,.55*g*e);dot(x,cy,12,[255,244,220],g*e)});ctx.strokeStyle=rgba(WHITE,.3*e);ctx.setLineDash([3,7]);ctx.beginPath();ctx.ellipse(0,cy,64,34,0,0,TAU);ctx.stroke();ctx.setLineDash([])}
  if(k===4){[-36,0,36].forEach((x,i)=>{const l=eo((t-4-i*5)/2);ring(x,cy+22,12,mix(GRAY,GOLD,l),.8*e,1.8);orb(x,cy+22,34*l+1,GOLD,.55*l*e);dot(x,cy+22,7*l,[255,240,200],l*e)});const all=eo((t-18)/3);star4(0,cy-22,22*all,[255,240,200],.9*all*e,0)}
  if(k===5){orb(0,cy,40,GOLD,.55*e);dot(0,cy,12,[255,240,200],e);for(let i=0;i<14;i++){const a=i/14*TAU,u=((t*.3+i*.07)%1);dot(Math.cos(a)*(14+u*58),cy+Math.sin(a)*(14+u*30),2.2*(1-u),GOLD,(1-u)*.9*e)}}
  if(k===6){const br=.5-.5*Math.cos((t%8)/8*TAU);ring(0,cy,26+10*br,GOLD,.6*e,1.8);orb(0,cy,60,GOLD,.4*e);ctx.strokeStyle=rgba(TEAL,.55*e);ctx.lineWidth=2;ctx.beginPath();for(let x=-60;x<=60;x+=3){const y=cy+8*Math.sin(x*.06-t*.5);x===-60?ctx.moveTo(x,y):ctx.lineTo(x,y)}ctx.stroke()}
}
function vProto(k){return t=>{
  const e=eo(t/2),rx=255,ry=102,cy=10,all=k>=7;
  const pos=PNAMES.map((_,i)=>{const a=-Math.PI/2+i*TAU/7;return[Math.cos(a)*rx,cy+Math.sin(a)*ry]});
  ctx.strokeStyle=rgba(WHITE,.12*e);ctx.lineWidth=1.2;ctx.beginPath();ctx.ellipse(0,cy,rx,ry,0,0,TAU);ctx.stroke();
  for(let i=0;i<7;i++){const lit=all||i<k,act=!all&&i===k,[x,y]=pos[i];
    if(lit&&i<6){const[x2,y2]=pos[i+1];if(all||i+1<k+0){ctx.strokeStyle=rgba(GOLD,.4*e);ctx.lineWidth=1.4;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x2,y2);ctx.stroke()}}
    const pulse=act?1+.15*Math.sin(t*2.2):1,c=(lit||act)?GOLD:GRAY;
    orb(x,y,(lit?46:act?60:28)*pulse,c,(lit?.45:act?.7:.15)*e);dot(x,y,(act?10:7)*pulse,(lit||act)?[255,240,200]:GRAY,((lit||act)?.95:.5)*e);ring(x,y,17*pulse,c,(lit||act?.7:.3)*e,1.4);
    txtS(PNAMES[i],x,y+(y<cy-20?-30:y>cy+40?38:(x<0?-0:0)+36),10,c,((lit||act)?.9:.4)*e,4)}
  if(all){const br=.5-.5*Math.cos((t%8)/8*TAU),r=34+14*br;orb(0,cy,r*3,GOLD,.45*e);ring(0,cy,r,GOLD,.6*e,1.6);dot(0,cy,r*.4,[255,240,200],.9*e)}
  else icon(k,t,e);
}}

const rp=mul(5),HAZE=Array.from({length:110},()=>{const a=rp()*TAU,rr=60+rp()*190,ta=rp()*TAU;return{a,rr,ta,sx:Math.cos(a)*rr*1.5,sy:Math.sin(a)*rr*.75,tx:Math.cos(ta)*78,ty:Math.sin(ta)*78,ph:rp()*TAU,r:1.5+rp()*2}});
const OBS=Array.from({length:16},()=>({x:(rp()-.5)*620,y:(rp()-.5)*230,r:3+rp()*6,ph:rp()*TAU,vx:(rp()-.5)*22,vy:(rp()-.5)*10}));
function vClear(t){
  const f=eio((t-5)/15);
  for(const h of HAZE){const x=lerp(h.sx+Math.sin(t*.4+h.ph)*14*(1-f),h.tx,f),y=lerp(h.sy+Math.cos(t*.35+h.ph)*10*(1-f),h.ty,f);
    orb(x,y,lerp(22,5,f),TEAL,lerp(.22,.5,f));dot(x,y,h.r*lerp(1,.7,f),WHITE,lerp(.4,.9,f))}
  const c=eo((t-17)/4);ring(0,0,78,[190,255,245],.9*c,2.2);ring(0,0,100,TEAL,.35*c,1);orb(0,0,60,TEAL,.4*c);
  for(let i=0;i<4;i++){const a=i*Math.PI/2;ctx.strokeStyle=rgba(TEAL,.55*c);ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(Math.cos(a)*108,Math.sin(a)*108);ctx.lineTo(Math.cos(a)*128,Math.sin(a)*128);ctx.stroke()}
  star4(0,0,16*c,[255,248,220],.95*c,t*.15);
  const oa=eo(t/3)*(1-eo((t-24)/4));for(const o of OBS){const k=Math.max(0,t-24);dot(o.x+o.vx*k+Math.sin(t*.3+o.ph)*6,o.y+o.vy*k,o.r*(1-.5*eo((t-24)/4)),GRAY,.45*oa)}
}

/* ---------- EPISODE 2 (VISION) visuals ---------- */
function vCompass(t){
  const e=eo(t/2.5),s=eio((t-4)/12),cy=20,R=92;
  const sk=.3+.7*s;orb(0,-112,60+60*s,GOLD,.45*sk*e);star4(0,-112,18+14*s,[255,240,200],sk*e,0);
  ring(0,cy,R,WHITE,.55*e,2);ring(0,cy,R+10,WHITE,.15*e,1);
  for(let i=0;i<36;i++){const a=i/36*TAU,L=i%9===0?14:6;ctx.strokeStyle=rgba(WHITE,(i%9===0?.6:.3)*e);ctx.lineWidth=i%9===0?2:1;ctx.beginPath();ctx.moveTo(Math.cos(a)*(R-4),cy+Math.sin(a)*(R-4));ctx.lineTo(Math.cos(a)*(R-4-L),cy+Math.sin(a)*(R-4-L));ctx.stroke()}
  const wild=t*3.1+Math.sin(t*5)*.9,th=lerp(wild,-Math.PI/2+Math.PI*2*Math.ceil((wild+Math.PI/2)/(Math.PI*2)),s)+(s>.98?.03*Math.sin(t*1.5):0);
  ctx.save();ctx.translate(0,cy);ctx.rotate(th+Math.PI/2);
  ctx.fillStyle=rgba(mix(GRAY,GOLD,s),.95*e);ctx.beginPath();ctx.moveTo(0,-R+16);ctx.lineTo(9,0);ctx.lineTo(0,10);ctx.lineTo(-9,0);ctx.closePath();ctx.fill();
  ctx.fillStyle=rgba(WHITE,.35*e);ctx.beginPath();ctx.moveTo(0,R-24);ctx.lineTo(7,0);ctx.lineTo(-7,0);ctx.closePath();ctx.fill();ctx.restore();
  dot(0,cy,6,[255,240,200],e);
  if(s>.6){const k=eo((s-.6)/.4);const g=ctx.createLinearGradient(0,cy-R,0,-112);g.addColorStop(0,rgba(GOLD,.5*k*e));g.addColorStop(1,rgba(GOLD,0));ctx.strokeStyle=g;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,cy-R);ctx.lineTo(0,-96);ctx.stroke()}
}
function vWrite(t){
  const e=eo(t/2.5),x0=-130,y0=-115,w=260,h=230,done=eo((t-22)/4);
  orb(0,0,220,GOLD,.25*done*e);
  ctx.fillStyle=rgba([236,228,206],.10+.06*done);ctx.strokeStyle=rgba([236,228,206],.6*e);ctx.lineWidth=1.6;rrect(x0,y0,w,h,6);ctx.fill();ctx.stroke();
  let pen=null;
  for(let i=0;i<7;i++){const ly=y0+38+i*26,t0=3+i*2.6,k=clamp((t-t0)/2.4);if(k<=0)continue;const L=(i===0?170:i===6?120:210-((i*37)%60)),xe=x0+22+L*k;
    ctx.strokeStyle=rgba(i===0?GOLD:[236,232,220],(.85)*e);ctx.lineWidth=i===0?2.6:1.7;ctx.beginPath();
    for(let x=x0+22;x<=xe;x+=2){const y=ly+3*Math.sin(x*.32+i)+1.5*Math.sin(x*.9+i*2);x===x0+22?ctx.moveTo(x,y):ctx.lineTo(x,y)}ctx.stroke();
    if(k<1)pen=[xe,ly]}
  if(pen){orb(pen[0],pen[1],22,GOLD,.6*e);dot(pen[0],pen[1],3.5,WHITE,e)}
  if(done>0)star4(x0+w-26,y0+26,16*done,[255,240,200],.9*done*e,t*.1);
}
const TILES=Array.from({length:40},(_,i)=>({c:i%8,r:Math.floor(i/8),tb:3+((i*7919)%97)/97*14}));
function scene(x0,y0,w,h,t,e){
  const g=ctx.createLinearGradient(0,y0,0,y0+h);g.addColorStop(0,rgba([40,50,100],e));g.addColorStop(.6,rgba([200,130,110],e));g.addColorStop(1,rgba([255,200,140],e));ctx.fillStyle=g;ctx.fillRect(x0,y0,w,h);
  orb(x0+w*.62,y0+h*.58,90,GOLD,.8*e);dot(x0+w*.62,y0+h*.58,24,[255,240,200],e);
  ctx.fillStyle=rgba([30,60,60],e);ctx.beginPath();ctx.moveTo(x0,y0+h);for(let x=x0;x<=x0+w;x+=6)ctx.lineTo(x,y0+h*.72+10*Math.sin((x-x0)*.03)+6*Math.sin((x-x0)*.08));ctx.lineTo(x0+w,y0+h);ctx.fill();
  ctx.fillStyle=rgba([18,40,40],e);ctx.beginPath();ctx.moveTo(x0,y0+h);for(let x=x0;x<=x0+w;x+=6)ctx.lineTo(x,y0+h*.84+8*Math.sin((x-x0)*.022+2));ctx.lineTo(x0+w,y0+h);ctx.fill();
  for(let i=0;i<5;i++){const bx=x0+w*.2+i*14+Math.sin(t*.5+i)*3,by=y0+h*.3+Math.sin(i*2)*8;ctx.strokeStyle=rgba([30,30,40],.7*e);ctx.lineWidth=1.4;ctx.beginPath();ctx.moveTo(bx-5,by);ctx.quadraticCurveTo(bx-2,by-3,bx,by);ctx.quadraticCurveTo(bx+2,by-3,bx+5,by);ctx.stroke()}
}
function vPic(grat){return t=>{
  const e=eo(t/2.5),w=320,h=190,x0=-w/2,y0=-h/2-10,tw=w/8,th=h/5;
  const full=grat?1:eo((t-18)/3);
  orb(0,-10,260,GOLD,(.15+.35*full)*e);
  ctx.save();rrect(x0,y0,w,h,4);ctx.clip();scene(x0,y0,w,h,t,1);
  if(!grat)TILES.forEach(q=>{const k=eo((t-q.tb)/1.5);if(k<1){ctx.fillStyle=rgba([10,22,34],1-k);ctx.fillRect(x0+q.c*tw-.5,y0+q.r*th-.5,tw+1,th+1)}});
  ctx.restore();
  ctx.strokeStyle=rgba([236,222,190],.85*e);ctx.lineWidth=5;rrect(x0-8,y0-8,w+16,h+16,6);ctx.stroke();
  if(!grat&&t<20){ctx.strokeStyle=rgba(WHITE,.12*e);ctx.lineWidth=1;for(let c=1;c<8;c++){ctx.beginPath();ctx.moveTo(x0+c*tw,y0);ctx.lineTo(x0+c*tw,y0+h);ctx.stroke()}for(let r=1;r<5;r++){ctx.beginPath();ctx.moveTo(x0,y0+r*th);ctx.lineTo(x0+w,y0+r*th);ctx.stroke()}}
  if(grat){for(let i=0;i<44;i++){const a=i*2.39996,u=((t*.12+i*.023)%1),r=380*(1-u)+170;dot(Math.cos(a)*r,-10+Math.sin(a)*r*.5,2,[255,225,160],Math.sin(u*Math.PI)*.85*e)}
    for(let k=0;k<3;k++){const rr=((t*22+k*60)%180);ctx.strokeStyle=rgba(GOLD,(1-rr/180)*.35*e);ctx.lineWidth=1.3;rrect(x0-8-rr*.6,y0-8-rr*.35,w+16+rr*1.2,h+16+rr*.7,8);ctx.stroke()}}
}}
const OBX=[[-300,-60,70,50],[-250,60,60,60],[-150,-110,50,40],[160,-100,60,44],[240,40,70,56],[300,-50,50,60],[-60,90,56,40],[90,95,64,40],[-330,10,40,40]];
function vSpot(t){
  const e=eo(t/2.5),settle=eio((t-10)/5),star=[0,-70];
  const swing=Math.sin(t*.9)*1.0+Math.sin(t*.37)*.4,ang=lerp(swing,0,settle),L=300,src=[0,150];
  const tx=src[0]+Math.sin(ang)*L,ty=src[1]-Math.cos(ang)*L*.75;
  OBX.forEach(([x,y,w,h],i)=>{const d=Math.hypot(x-tx,y-ty),lit=Math.max(0,1-d/150)*(1-settle),sc=lerp(1,.45,settle);
    ctx.fillStyle=rgba(GRAY,(.25+.45*lit)*e*(1-.5*settle));rrect(x-w*sc/2,y-h*sc/2,w*sc,h*sc,6);ctx.fill()});
  const g=ctx.createLinearGradient(src[0],src[1],tx,ty);g.addColorStop(0,rgba(GOLD,.05*e));g.addColorStop(1,rgba(GOLD,.4*e));ctx.fillStyle=g;
  const px=Math.cos(ang)*60,py=Math.sin(ang)*60*.75;ctx.beginPath();ctx.moveTo(src[0]-6,src[1]);ctx.lineTo(tx-px,ty-py);ctx.lineTo(tx+px,ty+py);ctx.lineTo(src[0]+6,src[1]);ctx.closePath();ctx.fill();
  orb(tx,ty,70,GOLD,.3*e);
  const sb=.35+.65*settle;orb(star[0],star[1],70+90*settle,GOLD,.55*sb*e);star4(star[0],star[1],22+22*settle,[255,240,200],sb*e,0);dot(star[0],star[1],6,WHITE,sb*e);
  txtS('VISION',star[0],star[1]+64,12,GOLD,.85*settle*e,6);
}
/* ---------- scene table ---------- */
const SC=[];let cur=0;const SECC={a:TEAL,b:BLUE,c:AMBER};
function add(name,dur,sec,def){SC.push(Object.assign({name,start:cur,dur,acc:SECC[sec]||GOLD},def));cur+=dur}
const HY=470,S1=530,S2=575,S3=620;
add('open',20,'',{vis:vOpen,lines:[['Take a slow breath.',HY,36,.8,5.5,'h'],['The Clear *Vision*',HY,58,6.2,null,'h'],['Step two of the *Abundance Protocol*',S1+5,24,10.5,null,'s']]});
add('haze',35,'a',{eyebrow:'FROM HAZE TO FOCUS',vis:vClear,lines:[['A vague wish stays a *wish*.',HY,46,1,12,'h'],['You cannot move toward a *blur*.',HY,46,13,22,'h'],['When the picture sharpens, everything *gathers*.',HY,40,23,null,'h']]});
add('know',40,'a',{eyebrow:'KNOW EXACTLY WHAT YOU WANT',vis:vCompass,lines:[['Know *exactly* what you want.',HY,48,1,null,'h'],['Not "more money" — *what* it buys, builds, and becomes.',S1,26,9,null,'s'],['Specific enough to *see*.',S2,26,19,null,'s'],['Then the needle stops spinning.',S3,26,28,null,'s']]});
add('write',35,'a',{eyebrow:'WRITE IT DOWN',vis:vWrite,lines:[['Write it *down*.',HY,52,1,null,'h'],['Ink turns intention into something *real*.',S1,26,7,null,'s'],['One page. Present tense. As if *already* done.',S2,26,15,null,'s'],['Read it morning and night.',S3,26,24,null,'s']]});
add('picture',40,'b',{eyebrow:'HOLD THE COMPLETED PICTURE',vis:vPic(false),lines:[['Hold the *completed* picture.',HY,48,1,null,'h'],['Not the steps. Not the obstacles. The *finished* scene.',S1,26,8,null,'s'],['Where are you? Who is with you? How does it feel?',S2,26,18,null,'s'],['See it. Feel it. *Dwell* there.',S3,26,28,null,'s']]});
add('spot',35,'b',{eyebrow:'DO NOT FEED THE OBSTACLES',vis:vSpot,lines:[['Do not dwell on *obstacles*.',HY,48,1,13,'h'],['Attention feeds what it *touches*.',HY,46,14,null,'h'],['Give your light to the *vision*.',S1,26,21,null,'s']]});
add('grat',40,'c',{eyebrow:'HOLD IT WITH GRATITUDE',vis:vPic(true),lines:[['Hold your vision with *gratitude*.',HY,46,1,null,'h'],['Thank you — as if it is *already on its way*.',S1,26,9,null,'s'],['Clarity plus gratitude becomes *faith*.',S2,26,19,null,'s'],['And faith moves you.',S3,26,28,null,'s']]});
add('practice',45,'',{acc:GOLD,eyebrow:'PRACTICE  ·  SEE ONE SCENE',vis:vBreath,lines:[['Close your eyes. See *one scene*.',HY,42,1,12,'a'],['From your completed vision.',S1,26,4,12,'s'],['Where you are. Who is with you. How it *feels*.',HY,36,13,24,'a'],['Breathe in… I see it *clearly*.',HY,42,25,35,'a'],['Breathe out… *thank you*.',HY,44,35.5,null,'a']]});
add('close',10,'',{acc:GOLD,vis:vClose,lines:[['See it *clearly*.',HY,58,1.2,null,'h'],['Choose *abundance*.',S1+10,28,4.5,null,'s']]});
const DUR=cur;window.DUR=DUR;
function render(gt){
  gt=clamp(gt,0,DUR-.001);ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;ctx.shadowBlur=0;
  drawBG(gt);
  const s=SC.find(s=>gt>=s.start&&gt<s.start+s.dur)||SC[SC.length-1];
  LT=gt-s.start;A=eo(LT/1.6)*eo((s.dur-LT)/1.6);ACC=s.acc;
  ctx.save();ctx.translate(640,255);ctx.globalAlpha=A;ctx.lineCap='butt';s.vis(LT);ctx.restore();ctx.globalAlpha=1;
  if(s.eyebrow){ctx.save();ctx.font='500 14px Inter';ctx.letterSpacing='7px';ctx.textAlign='center';ctx.fillStyle=rgba(ACC,.75*A*eo((LT-.4)/2));ctx.fillText(s.eyebrow,W/2+3,66);ctx.restore()}
  for(const l of s.lines)T(...l);
  // vignette + grain-free fade to black at the very start/end
  const v=ctx.createRadialGradient(640,360,300,640,360,820);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.45)');ctx.fillStyle=v;ctx.fillRect(0,0,W,H);
}
window.render=render;
if(location.hash==='#play'){const t0=performance.now();(function loop(){render(((performance.now()-t0)/1000)%DUR);requestAnimationFrame(loop)})()}else render(0);
